/* ---------------------------------------------------------------------
   Sistema de imagem-com-placeholder
   -----------------------------------------------------------------
   Regra importante: a imagem e o texto de placeholder NUNCA ficam
   sobrepostos ao mesmo tempo. Ou a URL existe e mostramos só a <img>
   (com o placeholder escondido, pronto para reaparecer se o link
   quebrar), ou a URL está vazia e mostramos só o texto — nunca os dois
   juntos. Isso evita o texto "vazar" atrás de PNGs com fundo transparente.
   --------------------------------------------------------------------- */

// Gera o CONTEÚDO interno (placeholder OU imagem) — usado na renderização
// inicial e para trocar a imagem principal da galeria.
function mediaContent(url, alt, placeholderHtml, imgClasses) {
  if (!url) {
    // Sem link cadastrado: mostra só o texto discreto, nada de <img>.
    return `<span class="media-placeholder flex items-center justify-center w-full h-full px-2 text-center">${placeholderHtml}</span>`;
  }
  // Com link cadastrado: mostra só a imagem. O placeholder fica pronto
  // (escondido) para reaparecer automaticamente caso o link esteja quebrado
  // — ver bindMediaFallbacks().
  return `
    <span class="media-placeholder hidden items-center justify-center w-full h-full px-2 text-center">${placeholderHtml}</span>
    <img src="${url}" alt="${alt}" class="media-image ${imgClasses}" data-fallback="true">
  `;
}

// Gera a CAIXA completa (moldura + conteúdo) — usado na renderização de cartões
function mediaBox(url, alt, placeholderHtml, boxClasses, imgClasses) {
  return `<div class="relative flex items-center justify-center overflow-hidden ${boxClasses}">${mediaContent(url, alt, placeholderHtml, imgClasses)}</div>`;
}

// Liga o tratamento de erro de carregamento: se uma <img data-fallback>
// falhar ao carregar (link quebrado, arquivo removido etc.), ela se
// esconde e o placeholder correspondente reaparece no lugar. Precisa ser
// chamada depois de qualquer innerHTML que insira imagens novas na tela.
function bindMediaFallbacks(root) {
  const scope = root || document;
  scope.querySelectorAll('img[data-fallback]').forEach(img => {
    img.addEventListener('error', () => {
      img.classList.add('hidden');
      const placeholder = img.previousElementSibling;
      if (placeholder && placeholder.classList.contains('media-placeholder')) {
        placeholder.classList.remove('hidden');
        placeholder.classList.add('flex');
      }
    }, { once: true });
  });
}

// imagem por trás — usado somente quando logoUrl está vazio.

  return `<span class="font-mono text-[10px] sm:text-[11px] uppercase tracking-widest text-stone">${brandName}</span>`;
}

// IMPORTANTE — logos: "dark:brightness-0 dark:invert" é o filtro que
// transforma qualquer PNG de traço escuro em uma versão branca
// automaticamente quando o modo escuro está ativo. No modo claro,
// nenhum filtro é aplicado e a logo aparece na cor original (escura).
const IMG_LOGO_CARD     = 'w-full h-full object-contain p-3 dark:brightness-0 dark:invert transition-all duration-300';
const IMG_LOGO_HEADER   = 'w-full h-full object-contain p-3 dark:brightness-0 dark:invert transition-all duration-300';
const IMG_PRODUCT_CARD  = 'w-full h-full object-contain p-6';
const IMG_GALLERY_MAIN  = 'w-full h-full object-contain p-8 sm:p-12';
const IMG_GALLERY_THUMB = 'w-full h-full object-contain p-1.5';

// Classes do "chip" que envolve toda logo: se ajusta ao tema (fundo claro
// no modo claro, fundo neutro escuro no modo escuro) para dar contraste
// correto à logo branca gerada pelo filtro acima.
const LOGO_CHIP = 'bg-bone dark:bg-graphite border border-line-light dark:border-line-dark rounded-sm transition-colors duration-300';


/* =====================================================================
   5) RENDERIZAÇÃO — TELA INICIAL (grade de marcas)
   ===================================================================== */

function renderHome() {
  const brands = Object.values(DATABASE); // preserva a ordem definida no DATABASE

  const brandCards = brands.map(brand => `
    <button
      class="group text-left border border-line-light dark:border-line-dark rounded-sm p-6 sm:p-7 flex flex-col gap-5 hover:border-ink dark:hover:border-paper transition-colors"
      data-action="open-brand" data-brand="${brand.slug}"
    >
      ${mediaBox(
        brand.logoUrl,
        `Logo ${brand.name}`,
        logoPlaceholder(brand.name),
        `h-16 sm:h-20 w-full ${LOGO_CHIP}`,
        IMG_LOGO_CARD
      )}

      <div>
        <p class="font-mono text-xs uppercase tracking-widest text-stone">${brand.name}</p>
        <p class="font-mono text-[11px] text-stone/70 mt-1">${brand.models.length} modelos disponíveis</p>
      </div>

      <span class="inline-flex items-center gap-2 text-sm font-mono uppercase tracking-widest group-hover:gap-3 transition-all">
        Ver modelos
        <svg class="w-3.5 h-3.5 -rotate-90" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </span>
    </button>
  `).join('');

  document.getElementById('app').innerHTML = `
    <div class="view-fade">
      <p class="font-mono text-xs uppercase tracking-[0.3em] text-stone mb-3">Catálogo</p>
      <h1 class="font-display text-3xl sm:text-4xl mb-8 sm:mb-10">Selecione uma marca</h1>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
        ${brandCards}
      </div>
    </div>
  `;

  attachActionListeners();
  bindMediaFallbacks();
}


/* =====================================================================
   6) RENDERIZAÇÃO — LISTAGEM DE MODELOS DE UMA MARCA
   ===================================================================== */

function renderBrand(brandSlug) {
  const brand = DATABASE[brandSlug];
  if (!brand) { renderHome(); return; }

  const modelCards = brand.models.map(model => {
    const firstImage = (model.images || []).find(Boolean) || '';

    return `
    <button
      class="group text-left border border-line-light dark:border-line-dark rounded-sm overflow-hidden hover:border-ink dark:hover:border-paper transition-colors"
      data-action="open-product" data-brand="${brandSlug}" data-product="${model.id}"
    >
      ${mediaBox(
        firstImage,
        model.name,
        photoPlaceholder(),
        'aspect-square w-full bg-bone dark:bg-graphite',
        IMG_PRODUCT_CARD
      )}
      <div class="p-4 sm:p-5 border-t border-line-light dark:border-line-dark">
        <p class="font-display text-lg leading-snug">${model.name}</p>
        <p class="font-mono text-xs text-stone mt-1.5 tracking-wide">${formatBRL(model.price)}</p>
      </div>
    </button>
  `;
  }).join('');

  document.getElementById('app').innerHTML = `
    <div class="view-fade">
      <nav class="flex items-center gap-2 font-mono text-xs uppercase tracking-widest text-stone mb-6">
        <button data-action="go-home" class="hover:text-ink dark:hover:text-paper transition-colors">RM Store</button>
        <span>/</span>
        <span class="text-ink dark:text-paper">${brand.name}</span>
      </nav>

      <button data-action="go-home" class="inline-flex items-center gap-1.5 text-sm font-mono uppercase tracking-widest text-stone hover:text-ink dark:hover:text-paper mb-8 transition-colors">
        ${chevronLeftIcon()} Voltar
      </button>

      <div class="flex items-center gap-5 mb-8 sm:mb-10">
        ${mediaBox(
          brand.logoUrl,
          `Logo ${brand.name}`,
          logoPlaceholder(brand.name),
          `h-14 sm:h-16 w-32 sm:w-40 shrink-0 ${LOGO_CHIP}`,
          IMG_LOGO_HEADER
        )}
        <div>
          <p class="font-mono text-xs uppercase tracking-widest text-stone">${brand.name}</p>
          <p class="font-mono text-[11px] text-stone/70 mt-1">${brand.models.length} modelos disponíveis</p>
        </div>
      </div>

      <div class="grid grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
        ${modelCards}
      </div>
    </div>
  `;

  attachActionListeners();
  bindMediaFallbacks();
}


/* =====================================================================
   7) RENDERIZAÇÃO — DETALHE DO PRODUTO + TRIAGEM
   ===================================================================== */

function renderProduct(brandSlug, productId) {
  const brand = DATABASE[brandSlug];
  const model = brand ? brand.models.find(m => m.id === productId) : null;
  if (!brand || !model) { renderHome(); return; }

  // Por padrão, considera a primeira cor e o primeiro tamanho já
  // selecionados, para que o botão do WhatsApp funcione imediatamente
  // — conforme a regra: "ou por padrão considerar" uma cor e um tamanho.
  state.selectedColor = model.colors[0];
  state.selectedSize = model.sizes[0];

  // Só considera fotos válidas (ignora strings vazias dentro de "images")
  const validImages = (model.images || []).filter(Boolean);
  const mainImage = validImages[0] || '';

  const colorButtons = model.colors.map(color => `
    <button
      class="color-option px-4 py-2 border rounded-full text-sm transition-colors border-line-light dark:border-line-dark hover:border-ink dark:hover:border-paper"
      data-color="${color}" aria-pressed="false"
    >${color}</button>
  `).join('');

  const sizeButtons = model.sizes.map(size => `
    <button
      class="size-option w-12 h-12 border rounded-sm text-sm font-mono transition-colors border-line-light dark:border-line-dark hover:border-ink dark:hover:border-paper"
      data-size="${size}" aria-pressed="false"
    >${size}</button>
  `).join('');

  // Miniaturas só aparecem quando há mais de uma foto válida
  const thumbButtons = validImages.length > 1
    ? `
      <div id="gallery-thumbs" class="flex flex-wrap gap-3 mt-4">
        ${validImages.map((img, i) => `
          <button
            class="thumb-option w-16 h-16 sm:w-20 sm:h-20 border rounded-sm overflow-hidden bg-bone dark:bg-graphite ${i === 0 ? 'border-ink dark:border-paper' : 'border-line-light dark:border-line-dark'}"
            data-index="${i}" data-url="${img}"
            aria-label="Ver foto — ângulo ${i + 1}"
          >
            ${mediaContent(img, `${model.name} — ângulo ${i + 1}`, photoPlaceholder(), IMG_GALLERY_THUMB)}
          </button>
        `).join('')}
      </div>`
    : '';

  document.getElementById('app').innerHTML = `
    <div class="view-fade">
      <nav class="flex flex-wrap items-center gap-2 font-mono text-xs uppercase tracking-widest text-stone mb-6">
        <button data-action="go-home" class="hover:text-ink dark:hover:text-paper transition-colors">RM Store</button>
        <span>/</span>
        <button data-action="open-brand" data-brand="${brandSlug}" class="hover:text-ink dark:hover:text-paper transition-colors">${brand.name}</button>
        <span>/</span>
        <span class="text-ink dark:text-paper">${model.name}</span>
      </nav>

      <button data-action="open-brand" data-brand="${brandSlug}" class="inline-flex items-center gap-1.5 text-sm font-mono uppercase tracking-widest text-stone hover:text-ink dark:hover:text-paper mb-8 transition-colors">
        ${chevronLeftIcon()} Voltar para ${brand.name}
      </button>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 lg:gap-14">

        <!-- Galeria de imagens -->
        <div class="lg:sticky lg:top-24 self-start">
          <div id="gallery-main" class="relative flex items-center justify-center overflow-hidden aspect-[4/3] w-full bg-bone dark:bg-graphite border border-line-light dark:border-line-dark rounded-sm">
            ${mediaContent(mainImage, model.name, photoPlaceholder(), IMG_GALLERY_MAIN)}
          </div>
          ${thumbButtons}
        </div>

        <!-- Informações e triagem -->
        <div>
          <p class="font-mono text-xs uppercase tracking-[0.3em] text-stone mb-2">${brand.name}</p>
          <h1 class="font-display text-3xl sm:text-4xl mb-3 leading-tight">${model.name}</h1>
          <p class="font-mono text-xl text-accent dark:text-accent-dark mb-8">${formatBRL(model.price)}</p>

          <div class="perforation"></div>

          <!-- Seletor de cor -->
          <div class="py-6">
            <p class="font-mono text-xs uppercase tracking-widest text-stone mb-3">Cor</p>
            <div id="color-options" class="flex flex-wrap gap-2.5">${colorButtons}</div>
          </div>

          <!-- Seletor de tamanho -->
          <div class="pb-6">
            <p class="font-mono text-xs uppercase tracking-widest text-stone mb-3">Tamanho</p>
            <div id="size-options" class="flex flex-wrap gap-2.5">${sizeButtons}</div>
          </div>

          <div class="perforation"></div>

          <!-- Aviso de triagem -->
          <div class="my-6 border border-line-light dark:border-line-dark rounded-sm px-4 py-4">
            <p class="font-mono text-[11px] uppercase tracking-widest text-stone mb-2">Nota</p>
            <p class="text-sm text-stone leading-relaxed italic">
              Este catálogo é uma ferramenta de triagem para facilitar o atendimento.
              A confirmação de disponibilidade, numeração e cor é feita diretamente com a nossa equipe.
            </p>
          </div>

          <!-- Prévia da mensagem que será enviada -->
          <div class="mb-6 border border-line-light dark:border-line-dark rounded-sm px-4 py-3 bg-ink/[0.02] dark:bg-paper/[0.03]">
            <p class="font-mono text-[11px] uppercase tracking-widest text-stone mb-2">Mensagem a ser enviada</p>
            <p id="message-preview" class="font-mono text-xs leading-relaxed text-ink dark:text-paper"></p>
          </div>

          <!-- CTA: WhatsApp -->
          <a
            id="whatsapp-cta"
            href="#" target="_blank" rel="noopener noreferrer"
            class="flex items-center justify-center gap-2.5 w-full py-4 rounded-sm font-mono text-sm uppercase tracking-widest bg-ink text-bone dark:bg-paper dark:text-graphite hover:opacity-90 transition-opacity"
          >
            ${chatIcon()} Conversar no WhatsApp
          </a>

          <div class="barcode text-stone mt-8"></div>
        </div>
      </div>
    </div>
  `;

  attachActionListeners();
  setupProductSelectors(model);
  setupGallery(model);
  bindMediaFallbacks();
}

// Configura a interatividade dos seletores de cor/tamanho e mantém o
// botão do WhatsApp sempre sincronizado com a seleção atual.
function setupProductSelectors(model) {
  const colorButtons = document.querySelectorAll('#color-options .color-option');
  const sizeButtons = document.querySelectorAll('#size-options .size-option');

  function updateActiveStyles(buttons, selectedValue, datasetKey) {
    buttons.forEach(btn => {
      const isActive = btn.dataset[datasetKey] === String(selectedValue);
      btn.setAttribute('aria-pressed', String(isActive));
      btn.classList.toggle('bg-ink', isActive);
      btn.classList.toggle('text-bone', isActive);
      btn.classList.toggle('border-ink', isActive);
      btn.classList.toggle('dark:bg-paper', isActive);
      btn.classList.toggle('dark:text-graphite', isActive);
      btn.classList.toggle('dark:border-paper', isActive);
    });
  }

  function updateCta() {
    const link = document.getElementById('whatsapp-cta');
    const preview = document.getElementById('message-preview');
    const hasSelection = Boolean(state.selectedColor) && Boolean(state.selectedSize);

    const message = `Olá! Tenho interesse no tênis ${model.name}, cor ${state.selectedColor}, tamanho ${state.selectedSize}. Tem disponível?`;
    preview.textContent = message;

    if (hasSelection) {
      link.href = buildWhatsAppLink(model.name, state.selectedColor, state.selectedSize);
      link.classList.remove('opacity-40', 'pointer-events-none');
    } else {
      // Regra de negócio: o botão só funciona com cor E tamanho definidos.
      link.href = '#';
      link.classList.add('opacity-40', 'pointer-events-none');
    }
  }

  colorButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      state.selectedColor = btn.dataset.color;
      updateActiveStyles(colorButtons, state.selectedColor, 'color');
      updateCta();
    });
  });

  sizeButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      state.selectedSize = Number(btn.dataset.size);
      updateActiveStyles(sizeButtons, state.selectedSize, 'size');
      updateCta();
    });
  });

  // Aplica o estado inicial (primeira cor e primeiro tamanho já selecionados)
  updateActiveStyles(colorButtons, state.selectedColor, 'color');
  updateActiveStyles(sizeButtons, state.selectedSize, 'size');
  updateCta();
}

// Configura a galeria: clicar numa miniatura troca a foto principal
function setupGallery(model) {
  const thumbButtons = document.querySelectorAll('#gallery-thumbs .thumb-option');
  if (!thumbButtons.length) return;

  thumbButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      const url = btn.dataset.url;
      const index = Number(btn.dataset.index);
      const galleryMain = document.getElementById('gallery-main');

      galleryMain.innerHTML = mediaContent(
        url, `${model.name} — ângulo ${index + 1}`, photoPlaceholder(), IMG_GALLERY_MAIN
      );
      bindMediaFallbacks(galleryMain); // religa o fallback para a nova <img>

      thumbButtons.forEach(b => {
        const isActive = b === btn;
        b.classList.toggle('border-ink', isActive);
        b.classList.toggle('dark:border-paper', isActive);
        b.classList.toggle('border-line-light', !isActive);
        b.classList.toggle('dark:border-line-dark', !isActive);
      });
    });
  });
}


/* =====================================================================
   8) NAVEGAÇÃO
   ===================================================================== */

function goHome() {
  state.screen = 'home';
  state.brandSlug = null;
  state.productId = null;
  window.scrollTo({ top: 0, behavior: 'instant' });
  renderHome();
}

function openBrand(brandSlug) {
  state.screen = 'brand';
  state.brandSlug = brandSlug;
  state.productId = null;
  window.scrollTo({ top: 0, behavior: 'instant' });
  renderBrand(brandSlug);
}

function openProduct(brandSlug, productId) {
  state.screen = 'product';
  state.brandSlug = brandSlug;
  state.productId = productId;
  window.scrollTo({ top: 0, behavior: 'instant' });
  renderProduct(brandSlug, productId);
}

// Delegação de eventos: qualquer elemento com data-action é tratado aqui.
// Isso evita reanexar listeners manualmente após cada re-renderização.
function attachActionListeners() {
  document.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', () => {
      const action = el.dataset.action;
      if (action === 'go-home') goHome();
      if (action === 'open-brand') openBrand(el.dataset.brand);
      if (action === 'open-product') openProduct(el.dataset.brand, el.dataset.product);
    });
  });
}


/* =====================================================================
   9) MODO ESCURO / CLARO
   ===================================================================== */

function applyInitialTheme() {
  // Usa a preferência do sistema operacional como estado inicial.
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.classList.toggle('dark', prefersDark);
}

function toggleTheme() {
  document.documentElement.classList.toggle('dark');
}

document.getElementById('btn-theme-toggle').addEventListener('click', toggleTheme);
document.getElementById('btn-logo').addEventListener('click', goHome);


/* =====================================================================
   10) INICIALIZAÇÃO
   ===================================================================== */

applyInitialTheme();
renderHome();
</script>
</body>
</html>
